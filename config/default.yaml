paths:
  dataset: public_dataset_upload
  data_version: public_dataset_upload_group_a
  processed: processed_data
  logs: logs

answerer:
  type: bm25_qwen
  # type: bm25_top1
  # type: contextual_bm25
  # type: hierarchical_bm25
  # type: option_verifier

structured_retrieval:
  units_path: processed_data/chunks.jsonl
  top_k_patches: 5
  max_evidence_chars: 12000
  bm25_top1_chunk_chars: 1800
  bm25_k1: 1.5
  bm25_b: 0.75

run:
  questions: public_dataset_upload/questions/group_a
  output_dir: runs/01_bm25_qwen_v0
  previous_run: runs/00_bm25_top1

model:
  name: qwen3.7-max
  prompt_version: bm25_top5_v0
  api_key_env: DASHSCOPE_API_KEY
  api_key_env_fallbacks:
    - QWEN_API_KEY
  base_url_env: QWEN_BASE_URL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0
  max_tokens: 768
  timeout_seconds: 120
  extra_body:
    enable_thinking: true
